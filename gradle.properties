# # # # # # # # # # # # # #
#    Project Properties   #
# # # # # # # # # # # # # #

# Gradle Settings
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 4.10.0

# Data Properties
data.mod_id = talking_huds
data.mod_name = Talking Huds
data.mod_slug = talking-huds
data.mod_jar_name = talking-huds
data.mod_version = 1.0.0
data.mod_group = me.zipestudio.talkinghuds
data.mod_maven_group = me.zipestudio
data.mixin_configs = none
data.sides = client

data.mod_description = Client-side addon for Plasmo Voice & Simple Voice Chat, that replaces their voice overlay with a new one that has several styles.
data.mod_authors = ZipeStudio, MrLemonHog
data.github_author = ZipeStudio
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.42
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Per-Loader Versions
fabric.multi_versions = 1.20.1 1.21.1 1.21.11 26.1 26.2 26.3
neoforge.multi_versions = 1.21.1 1.21.11 26.1 26.2 26.3
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric neoforge forge

# Build Properties
build.fabric_loader = 0.19.3
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.parchment = [VERSIONED]
build.forge = [VERSIONED]

# Additional Dependencies, "dep." is important
dep.modmenu = [VERSIONED]
dep.plasmo-voice = [VERSIONED]
dep.simple-voice-chat = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Supported Versions, 1.21[1] -> 1.21-1.21.1
fabric.versions_specifications = 26.1[26.1.2]
neoforge.versions_specifications = 26.1[26.1.2]
forge.versions_specifications = 1.20.1

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = none
curseforge_id = none

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 25

# Fabric Mod Depends
fabric.depends_requires = fabric-api
fabric.depends_optional = modmenu plasmo-voice simple-voice-chat
fabric.depends_incompatible = none
fabric.depends_embeds = none

# NeoForge Mod Depends
neoforge.depends_requires = none
neoforge.depends_optional = plasmo-voice simple-voice-chat
neoforge.depends_incompatible = none
neoforge.depends_embeds  = none

# Forge Dependencies
forge.depends_requires = none
forge.depends_optional = plasmo-voice simple-voice-chat
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
